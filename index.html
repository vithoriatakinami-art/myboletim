<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cabeçalho -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">9º Ano — Estudante Exemplo</p>
  </header>

  <!-- Cards de resumo (preenchidos pelo JavaScript) -->
  <section class="cards" id="cards">
    <!-- Os cards serão criados automaticamente pelo script.js -->
  </section>

  <!-- Tabela de notas -->
  <section class="tabela-container">
    <table class="boletim" id="tabelaBoletim">
      <thead>
        <tr>
          <th>Disciplina</th>
          <th>1º Tri</th>
          <th>2º Tri</th>
          <th>3º Tri</th>
          <th>Média</th>
          <th>Faltas</th>
          <th>Situação</th>
        </tr>
      </thead>
      <tbody id="corpoTabela">
        <!-- As linhas serão criadas automaticamente pelo script.js -->
      </tbody>
    </table>
  </section>

  <!-- Liga o JavaScript no final da página -->
  <script src="script.js"></script>
</body>
</html>
